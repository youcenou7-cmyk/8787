<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>夜警 YAKEI</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;color:#eee;
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif TC","PMingLiU",serif;touch-action:none;}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;}
  .layer{position:fixed;inset:0;pointer-events:none;}
  #fade{background:#000;opacity:1;transition:opacity 1s linear;z-index:20;}
  #card{z-index:21;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    text-align:center;padding:0 24px;opacity:0;transition:opacity .9s;}
  #card .jp{font-size:clamp(17px,2.6vw,26px);letter-spacing:.12em;text-shadow:0 0 6px #000;}
  #card .zh{font-size:clamp(12px,1.6vw,15px);color:#9a9a9a;letter-spacing:.1em;}
  #title{z-index:30;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(20,24,18,.55),#000 75%);cursor:pointer;text-align:center;padding:0 16px;}
  #title h1{font-size:clamp(64px,14vw,150px);margin:0;letter-spacing:.25em;font-weight:700;color:#d8d8cc;
    text-shadow:0 0 18px rgba(160,0,0,.6),3px 0 0 rgba(255,0,0,.35),-3px 0 0 rgba(0,180,255,.25);animation:jit 3s infinite;}
  #title .sub{letter-spacing:.6em;color:#8a8a80;font-size:clamp(11px,1.6vw,15px);margin-top:4px;}
  #title .start{margin-top:46px;font-size:clamp(14px,2vw,18px);letter-spacing:.3em;animation:blink 1.6s infinite;}
  #title .help{margin-top:28px;color:#6d6d66;font-size:12px;line-height:1.9;letter-spacing:.08em;font-family:monospace;}
  @keyframes blink{50%{opacity:.25}}
  @keyframes jit{0%,92%,100%{transform:none}93%{transform:translate(3px,-1px) skewX(4deg)}95%{transform:translate(-4px,1px)}97%{transform:translate(2px,0) skewX(-3deg)}}
  #obj{z-index:10;top:16px;left:18px;right:auto;bottom:auto;font-size:13px;color:#cfcfc4;letter-spacing:.06em;
    text-shadow:0 0 4px #000,0 0 2px #000;opacity:0;transition:opacity .6s;max-width:70vw;}
  #obj b{color:#e9d9a0;font-weight:400;}
  #obj .zh{color:#8d8d86;font-size:11px;}
  #cross{z-index:10;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,255,255,.55);inset:auto;}
  #prompt{z-index:10;inset:auto;left:50%;top:calc(50% + 26px);transform:translateX(-50%);font-size:14px;color:#fff;
    text-shadow:0 0 4px #000;letter-spacing:.1em;opacity:0;transition:opacity .15s;white-space:nowrap;}
  #prompt kbd{border:1px solid #aaa;border-radius:3px;padding:0 5px;margin-right:6px;font-family:monospace;font-size:12px;}
  #dlg{z-index:15;inset:auto;left:0;right:0;bottom:7%;text-align:center;display:none;padding:0 16px;}
  #dlg .jp{font-size:clamp(18px,3vw,34px);color:#fff;letter-spacing:.08em;text-shadow:0 0 6px #000,0 0 3px #000,0 0 12px #000;}
  #dlg .zh{font-size:clamp(12px,1.6vw,16px);color:#bdbdb4;margin-top:6px;text-shadow:0 0 4px #000;letter-spacing:.06em;}
  #dlg .sp{font-size:12px;color:#9c9c90;margin-bottom:4px;letter-spacing:.2em;}
  #dlg .arrow{margin-top:10px;color:#ddd;font-size:22px;animation:bob 1s infinite;opacity:0;}
  @keyframes bob{50%{transform:translateY(5px)}}
  #camhud{z-index:12;display:none;font-family:"Courier New",monospace;color:#f2f2f2;text-shadow:0 0 3px #000;}
  #camhud .corner{position:absolute;width:40px;height:40px;border:2px solid rgba(255,255,255,.75);}
  #camhud .tl{left:20px;top:20px;border-right:none;border-bottom:none}
  #camhud .tr{right:20px;top:20px;border-left:none;border-bottom:none}
  #camhud .bl{left:20px;bottom:20px;border-right:none;border-top:none}
  #camhud .br{right:20px;bottom:20px;border-left:none;border-top:none}
  #camhud .info{position:absolute;left:36px;top:32px;font-size:clamp(14px,2vw,20px);line-height:1.5;}
  #camhud .rec{position:absolute;right:38px;top:32px;font-size:clamp(14px,2vw,20px);}
  #camhud .rec i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#f22;margin-right:8px;animation:blink 1s infinite;}
  #camhud .bar{position:absolute;left:0;right:0;bottom:34px;display:flex;justify-content:center;gap:10px;pointer-events:auto;flex-wrap:wrap;padding:0 50px;}
  #camhud button{font-family:inherit;font-size:14px;background:rgba(0,0,0,.55);color:#eee;border:1px solid rgba(255,255,255,.6);
    padding:8px 14px;cursor:pointer;letter-spacing:.08em;}
  #camhud button:hover{background:rgba(255,255,255,.15)}
  #camhud button.report{border-color:#f55;color:#ffb3b3}
  #camhud .msg{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:clamp(16px,2.4vw,24px);letter-spacing:.15em;opacity:0;transition:opacity .3s;}
  #camhud .count{position:absolute;right:38px;top:64px;font-size:13px;color:#ccc;}
  #over{z-index:40;display:none;pointer-events:auto;background:rgba(0,0,0,.85);flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  #over h2{font-size:clamp(40px,8vw,80px);color:#b00;letter-spacing:.3em;margin:0;text-shadow:0 0 20px #600;}
  #over p{color:#999;letter-spacing:.1em;}
  #over button,#endbtn{margin-top:20px;font-family:inherit;font-size:16px;background:none;color:#ddd;border:1px solid #777;padding:10px 26px;cursor:pointer;letter-spacing:.2em;}
  #touch{z-index:14;display:none;}
  #stick{position:absolute;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:none;}
  #stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.25);}
  .tbtn{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.45);
    background:rgba(0,0,0,.35);color:#eee;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:inherit;}
  #tUse{right:26px;bottom:40px;width:76px;height:76px;font-size:15px}
  #tLight{right:116px;bottom:30px;}
  #flash{z-index:19;background:#fff;opacity:0;}
</style>
</head>
<body>
<div id="fade" class="layer"></div>
<div id="flash" class="layer"></div>
<div id="card" class="layer"></div>
<div id="title" class="layer">
  <h1>夜警</h1>
  <div class="sub">YAKEI ─ NIGHT SHIFT</div>
  <div class="start">クリックして開始　/　點擊開始</div>
  <div class="help">WASD 移動 ・ SHIFT 跑 ・ 滑鼠 視角 ・ E 調查 ・ F 手電筒<br>監視器：← → 切換 ・ R 回報異常 ・ Q 離開<br>建議戴耳機遊玩 🎧</div>
</div>
<div id="obj" class="layer"></div>
<div id="cross" class="layer"></div>
<div id="prompt" class="layer"></div>
<div id="dlg" class="layer"><div class="sp"></div><div class="jp"></div><div class="zh"></div><div class="arrow">▼</div></div>
<div id="camhud" class="layer">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="info"><div id="camName">CAM 01</div><div id="camTime">02:00:00</div></div>
  <div class="rec"><i></i>REC</div>
  <div class="count" id="camCount"></div>
  <div class="msg" id="camMsg"></div>
  <div class="bar">
    <button id="bPrev">◀ 前</button><button id="bNext">次 ▶</button>
    <button id="bReport" class="report">異常報告 [R]</button><button id="bExit">離席 [Q]</button>
  </div>
</div>
<div id="touch" class="layer">
  <div id="stick"><i></i></div>
  <button class="tbtn" id="tUse">調べる</button>
  <button class="tbtn" id="tLight">ライト</button>
</div>
<div id="over" class="layer"><h2>死</h2><p id="overMsg"></p><button id="retry">もう一度 / 重試</button></div>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   基本設定
   ========================================================= */
const $ = id => document.getElementById(id);
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const RES = 0.5;                                  // 內部解析度（低解析度＝VHS 感）
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.08);
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.05, 90);
camera.rotation.order = 'YXZ';
scene.add(camera);

const mainRT = new THREE.WebGLRenderTarget(2, 2, { depthBuffer: true });
function resize() {
  renderer.setSize(innerWidth, innerHeight);

  secCams.forEach(c => { c.aspect = camera.aspect; c.updateProjectionMatrix(); });
  mainRT.setSize(Math.max(2, Math.floor(innerWidth * RES)), Math.max(2, Math.floor(innerHeight * RES)));
  post.uniforms.res.value.set(innerWidth, innerHeight);

/* ---------- VHS 後製 ---------- */
const post = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: mainRT.texture }, time: { value: 0 }, glitch: { value: 0 },
    tint: { value: new THREE.Vector3(1, 1, 1) }, nv: { value: 0 }, res: { value: new THREE.Vector2(1, 1) }, gain: { value: 1 }

  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `

    varying vec2 vUv;
    float rnd(vec2 c){ return fract(sin(dot(c, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){
      vec2 cc = vUv - .5; float r2 = dot(cc,cc);
      vec2 uv = .5 + cc * (1. + .07*r2 + .05*nv*r2);
      float ln = floor(uv.y * 220.);
      float sh = (rnd(vec2(ln, floor(time*24.))) - .5) * .03 * glitch;
      sh += sin(uv.y*700. + time*12.) * .0005;
      float band = smoothstep(.0,.03, abs(fract(uv.y*.7 - time*.06) - .5) - .45);
      sh += (1.-band) * .004;
      uv.x += sh;
      float ca = .0018 + .012*glitch + .006*r2;
      vec3 col;
      col.r = texture2D(tDiffuse, uv + vec2(ca,0.)).r;
      col.g = texture2D(tDiffuse, uv).g;
      col.b = texture2D(tDiffuse, uv - vec2(ca,0.)).b;
      // soft glow
      vec3 blur = texture2D(tDiffuse, uv + vec2(.004,.003)).rgb + texture2D(tDiffuse, uv - vec2(.004,.003)).rgb

      col += max(blur*.25 - .35, 0.) * .6;
      col *= gain;
      float l = dot(col, vec3(.299,.587,.114));
      col = mix(vec3(l), col, mix(.72, .0, nv));
      col *= tint;
      col = mix(col, vec3(l*.8, l*1.05, l*.85) * 1.1, nv*.6);
      col = pow(max(col, 0.), vec3(1./2.2));
      col *= .93 + .07 * sin(vUv.y * res.y * 1.3);
      col += (rnd(vUv * res * .5 + fract(time)) - .5) * (.07 + .1*nv + .25*glitch);
      col *= smoothstep(.9, .25, length(cc * vec2(1., 1.15)));
      if (uv.x < 0. || uv.x > 1. || uv.y < 0. || uv.y > 1.) col = vec3(0.);
      if (glitch > .6 && rnd(vec2(floor(time*30.), ln)) > .985) col = vec3(rnd(uv+time));
      gl_FragColor = vec4(col, 1.);
    }`
});
const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));

/* =========================================================
   程序化貼圖
   ========================================================= */
function cvs(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; if (rep) t.repeat.set(rep[0], rep[1]); return t;

    const x = R() * w, y = R() * h, r = r0 + R() * (r1 - r0);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, cols[i % cols.length]); gr.addColorStop(1, 'rgba(0,0,0,0)');

  if (opt.scr) scratches(g, 512, 512, opt.scr, 'rgba(40,40,30,.25)');
  if (opt.drip) drips(g, 512, 512, opt.drip, opt.dripCol ?? 'rgba(40,40,20,.12)');

}
const TX = {};
TX.grime = surface('#8b8c74', { scr: 120, drip: 40 });
TX.plain = surface('#b9bcb8', { blots: 18, dark: ['rgba(60,60,60,.18)', 'rgba(255,255,255,.08)'], speck: 1500, speckA: .1, drip: 10 });
TX.office = surface('#a7a59a', { blots: 20, dark: ['rgba(40,40,40,.2)'], speck: 1500, speckA: .12 });
TX.carpet = (() => { const [c, g] = cvs(256, 256); g.fillStyle = '#45484e'; g.fillRect(0, 0, 256, 256); speck(g, 256, 256, 9000, .3); blot(g, 256, 256, 8, ['rgba(0,0,0,.25)'], 20, 80); return c; })();
TX.ceil = (() => {
  const [c, g] = cvs(256, 256); g.fillStyle = '#c3c0b6'; g.fillRect(0, 0, 256, 256); speck(g, 256, 256, 2500, .35);
  g.strokeStyle = '#6f6c64'; g.lineWidth = 4; g.strokeRect(0, 0, 256, 256); blot(g, 256, 256, 4, ['rgba(110,90,40,.25)'], 20, 70); return c;
})();
function planks(base, dark) {
  const [c, g] = cvs(512, 512);
  for (let y = 0; y < 512; y += 32) {
    let x = -(R() * 200);
    while (x < 512) {
      const L = 140 + R() * 200, s = (R() - .5) * 30;
      g.fillStyle = base; g.fillRect(x, y, L, 32);
      g.fillStyle = `rgba(${s > 0 ? 255 : 0},${s > 0 ? 220 : 0},${s > 0 ? 180 : 0},${Math.abs(s) / 120})`; g.fillRect(x, y, L, 32);
      for (let k = 0; k < 6; k++) { g.fillStyle = `rgba(0,0,0,${R() * .12})`; g.fillRect(x, y + R() * 32, L, 1); }
      g.fillStyle = dark; g.fillRect(x, y, 2, 32); x += L;
    }
    g.fillStyle = dark; g.fillRect(0, y, 512, 2);
  }
  speck(g, 512, 512, 1500, .12); return c;
}
TX.wood = planks('#a07850', 'rgba(40,20,10,.6)');
TX.woodDark = planks('#6a4630', 'rgba(20,10,5,.7)');
TX.furn = planks('#8c6a4a', 'rgba(40,25,15,.4)');
TX.cave = surface('#3c3528', { blots: 70, dark: ['rgba(0,0,0,.5)', 'rgba(120,100,60,.2)', 'rgba(70,10,5,.35)'], speck: 6000, speckA: .3, scr: 200, drip: 60, dripCol: 'rgba(0,0,0,.25)' });
TX.red = (() => {
  const c = surface('#6e2a22', { blots: 40, dark: ['rgba(0,0,0,.35)', 'rgba(200,40,30,.25)'], speck: 3000, drip: 80, dripCol: 'rgba(120,0,0,.5)' });
  const g = c.getContext('2d'); g.font = 'bold 30px serif'; g.fillStyle = 'rgba(170,10,10,.85)';
  const words = ['死', '呪', '帰れ', '見るな', '助けて', '殺', '後ろ'];
  for (let i = 0; i < 40; i++) { g.save(); g.translate(R() * 512, R() * 512); g.rotate((R() - .5) * .5); g.font = `bold ${16 + R() * 26}px serif`; g.fillText(words[i % words.length], 0, 0); g.restore(); }
  return c;
})();
function decal(w, h, draw) { const [c, g] = cvs(w, h); draw(g, w, h); const t = toTex(c); t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; return t; }
const bloodTrail = decal(256, 1024, (g, w, h) => {
  for (let i = 0; i < 900; i++) {
    const t = i / 900, x = w / 2 + Math.sin(t * 5) * 40 + (R() - .5) * 70 * (1 - t * .5), y = t * h;
    g.fillStyle = `rgba(${70 + R() * 40},0,0,${.25 + R() * .4})`; g.beginPath(); g.ellipse(x, y, 6 + R() * 30, 3 + R() * 10, R(), 0, 7); g.fill();
  }
  for (let i = 0; i < 60; i++) { g.fillStyle = 'rgba(60,0,0,.5)'; g.beginPath(); g.ellipse(R() * w, R() * h, 2, 2, 0, 0, 7); g.fill(); }
});
const bloodPool = decal(256, 256, (g) => {
  for (let i = 0; i < 160; i++) { const a = R() * 7, r = R() * 90; g.fillStyle = `rgba(${60 + R() * 40},0,0,${.3 + R() * .4})`; g.beginPath(); g.ellipse(128 + Math.cos(a) * r, 128 + Math.sin(a) * r, 8 + R() * 30, 5 + R() * 20, R(), 0, 7); g.fill(); }
});
const bloodStreak = decal(64, 512, (g) => {
  for (let i = 0; i < 400; i++) { const y = R() * 512; g.fillStyle = `rgba(${80 + R() * 40},0,0,${R() * .5})`; g.fillRect(28 + (R() - .5) * 12 * (y / 512), y, 3 + R() * 5, 6 + R() * 40); }
});
function kanji(text, size = 360, col = '#c00') {
  return decal(512, 512, (g) => {
    g.font = `900 ${size}px "Hiragino Mincho ProN","Yu Mincho",serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = col; g.shadowColor = 'rgba(120,0,0,.8)'; g.shadowBlur = 12;

  return decal(512, 512, (g) => {
    for (let k = 0; k < 9; k++) {

      g.fillStyle = 'rgba(120,0,0,.85)'; g.beginPath(); g.ellipse(0, 0, 26, 32, 0, 0, 7); g.fill();

  return decal(w, h, (g) => { g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = fg; g.font = `bold ${fs}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2 + 2); });
}
const cityTex = decal(512, 384, (g, w, h) => {
  g.fillStyle = '#05070c'; g.fillRect(0, 0, w, h);

const texCache = {};
function texFor(name) { if (!texCache[name]) texCache[name] = toTex(TX[name]); return texCache[name]; }
function tm(name, rx = 1, ry = 1, extra = {}) {
  const t = texFor(name).clone(); t.repeat.set(rx, ry); t.needsUpdate = true;
  return new THREE.MeshStandardMaterial({ map: t, roughness: .92, metalness: 0, ...extra });
}
const cm = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: .8, metalness: 0, ...extra });
const bm = (map, extra = {}) => new THREE.MeshBasicMaterial({ map, ...extra });
const BOX = new THREE.BoxGeometry(1, 1, 1);
function box(parent, w, h, d, x, y, z, mat, ry = 0) {
  const m = new THREE.Mesh(BOX, mat); m.scale.set(w, h, d); m.position.set(x, y, z); m.rotation.y = ry; parent.add(m); return m;
}
function cyl(parent, rt, rb, h, x, y, z, mat, seg = 12) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.position.set(x, y, z); parent.add(m); return m;
}
function plane(parent, w, h, mat, x, y, z, rx = 0, ry = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(x, y, z); m.rotation.set(rx, ry, 0, 'YXZ'); parent.add(m); return m;
}
function decalMat(tex, extra = {}) { return new THREE.MeshStandardMaterial({ map: tex, transparent: true, depthWrite: false, roughness: .6, polygonOffset: true, polygonOffsetFactor: -2, ...extra }); }
function collider(area, minX, maxX, minZ, maxZ) { area.colliders.push({ minX, maxX, minZ, maxZ }); }
function solid(area, parent, w, h, d, x, y, z, mat, ry = 0) {
  const m = box(parent, w, h, d, x, y, z, mat, ry);
  const sw = Math.abs(Math.cos(ry)) > .5 ? w : d, sd = Math.abs(Math.cos(ry)) > .5 ? d : w;
  collider(area, x - sw / 2, x + sw / 2, z - sd / 2, z + sd / 2); return m;
}
function room(area, x0, x1, z0, z1, h, wall, floor, ceil, skip = []) {
  const g = area.group, W = x1 - x0, D = z1 - z0, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
  box(g, W, .1, D, cx, -.05, cz, tm(floor[0], W / floor[1], D / floor[1]));
  if (ceil) box(g, W, .1, D, cx, h + .05, cz, tm(ceil[0], W / ceil[1], D / ceil[1]));
  if (!skip.includes('N')) solid(area, g, W + .4, h, .2, cx, h / 2, z0 - .1, tm(wall[0], W / wall[1], h / wall[1]));
  if (!skip.includes('S')) solid(area, g, W + .4, h, .2, cx, h / 2, z1 + .1, tm(wall[0], W / wall[1], h / wall[1]));
  if (!skip.includes('W')) solid(area, g, .2, h, D, x0 - .1, h / 2, cz, tm(wall[0], D / wall[1], h / wall[1]));
  if (!skip.includes('E')) solid(area, g, .2, h, D, x1 + .1, h / 2, cz, tm(wall[0], D / wall[1], h / wall[1]));
}

const AU = { ctx: null };

    const gn = ctx.createGain(); gn.gain.value = gain; s.connect(fl); fl.connect(gn); gn.connect(master); s.start(); return gn;
  };

}
function env(g, t, a, peak, dec) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + dec); }

    } else setGain(AU.sweep, 0, .2);
